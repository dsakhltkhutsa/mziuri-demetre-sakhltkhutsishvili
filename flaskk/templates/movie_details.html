{% extends "base.html" %}

{% block content %}
    <h1>This is Movie details page</h1>
    <h3>Id: {{ movie_id }}</h3>
        <div class="card mb-3">
          <img src="/static/images/{{ movie['img']}}" height = "400px" width = "400px" class="card-img-top" alt="...">
          <div class="card-body">
            <h5 class="card-title">{{ movie["title"]}}</h5>
            <p class="card-text">{{ movie["rating"]}}</p>
            <p class="card-text"><small class="text-muted">Last updated 3 mins ago</small></p>
          </div>
        </div>
{% endblock %}
