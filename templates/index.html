<!--base.html-თან დაკავშირება-->
{% extends 'base.html' %}

<!--base.html-ში გამოყოფილ ადგილას ჩვენთვის სასურველი საიტის სათაურის ჩასმა ჯინჯას ბლოკის მეშვეობით -->
{% block title %} MOVIE PAGE {% endblock %}

<!--base.html-ში გამოყოფილ ადგილას ჩვენთვის სასურველი კონტენტის ჩასმა ჯინჯას ბლოკის მეშვეობით -->
{% block content %}
<h1>This is Movie page</h1>
<div class="row">
    {% for movie in movies %}
    <div class="col">
        <div class="card" style="width: 18rem;">
            <img src="/static/images/{{ movie['img'] }}" class="card-img-top" alt="Movie Poster Image">
            <div class="card-body">
                <h5 class="card-title">{{ movie["title"] }}</h5>
                <p class="card-text">{{ movie["director"] }}</p>
                <a href="/movie/{{ movie['id'] }}" class="btn btn-primary">See details</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
